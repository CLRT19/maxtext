# Qwen2.5-VL-7B-Instruct configuration.
# https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct
#
# The text decoder is identical to Qwen2.5-7B-Instruct (28 layers, 3584 hidden,
# 28 query heads, 4 KV heads, head_dim=128). The vision tower is a 32-layer ViT
# with windowed attention (full attention at every 8th layer) and a 2x2 spatial
# patch merger that projects to the LM hidden size (3584).

# ------------------ Text decoder (matches Qwen2.5-7B) ------------------
base_emb_dim: 3584
base_num_query_heads: 28
base_num_kv_heads: 4
base_mlp_dim: 18944
base_num_decoder_layers: 28
head_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 152064
decoder_block: "qwen2"
normalization_layer_epsilon: 1e-06
rope_max_timescale: 1000000.0
use_qk_norm: False
attention_bias: True
logits_via_embedding: False
normalize_embedding_logits: False
tokenizer_type: "huggingface"

# ------------------ MRoPE ------------------
# Qwen2.5-VL uses 3-axis MRoPE with sections [16, 24, 24] over head_dim=128.
use_mrope: True
mrope_section: [16, 24, 24]

# ------------------ Multimodal flags ------------------
use_multimodal: True
freeze_vision_encoder_params: True
image_placeholder: "<|image_pad|>"
video_placeholder: "<|video_pad|>"

# Special token ids (HF config).
image_token_id: 151655
video_token_id: 151656
vision_start_token_id: 151652
vision_end_token_id: 151653

# ------------------ Vision tower (Qwen2.5-VL) ------------------
hidden_size_for_vit: 1280
intermediate_size_for_vit: 3420
num_attention_heads_for_vit: 16
num_hidden_layers_for_vit: 32
num_channels_for_vit: 3
patch_size_for_vit: 14
conv_stride_for_vit: 14            # patch_size; conv stride equals patch in Qwen2.5-VL
spatial_merge_size_for_vit: 2
temporal_patch_size_for_vit: 2
out_hidden_size_for_vit: 3584      # projection target = LM hidden size
window_size_for_vit: 112
fullatt_block_indexes_for_vit: [7, 15, 23, 31]
rope_theta_for_vit: 10000
